name: "Juma Garage App Deploy"

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::457713535842:role/GitHubActionsTerraformRole
          aws-region: us-east-1 # Ensure this matches your infra region

      # 1. Install Terraform on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0" # Or your preferred version

      # 2. Initialize (connect to your S3 backend)
      - name: Terraform Init
        run: terraform init

      # 3. Apply the changes
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
