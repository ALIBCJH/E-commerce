name: Deploy Backend to EC2

on:
  workflow_run:
    workflows: ["Build and Push Backend Container"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  AWS_REGION: us-east-1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ecommerce-backend
  DEFAULT_AWS_DEPLOY_ROLE_ARN: arn:aws:iam::457713535842:role/ecommerce-github-actions-ssm-role

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve AWS role ARN
        id: aws-role
        run: |
          ROLE_ARN="${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          if [ -z "$ROLE_ARN" ]; then
            ROLE_ARN="${{ secrets.AWS_DEPLOY_ROLE_ARN }}"
          fi
          if [ -z "$ROLE_ARN" ]; then
            ROLE_ARN="${{ env.DEFAULT_AWS_DEPLOY_ROLE_ARN }}"
          fi

          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Missing AWS_DEPLOY_ROLE_ARN in repository variables/secrets and no fallback is available"
            echo "::error::Set AWS_DEPLOY_ROLE_ARN to terraform output -raw github_actions_deploy_role_arn"
            exit 1
          fi

          if ! echo "$ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+'; then
            echo "::error::Invalid AWS_DEPLOY_ROLE_ARN format: $ROLE_ARN"
            exit 1
          fi

          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify OIDC role assumption
        run: |
          ASSUMED_ARN=$(aws sts get-caller-identity --query 'Arn' --output text)
          echo "::notice::Authenticated to AWS as ${ASSUMED_ARN}"

      - name: Get Backend Instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecommerce-backend" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "::error::No running backend instance found with tag Name=ecommerce-backend"
            echo "::error::Check EC2 tags/state and ensure Terraform outputs match workflow filters"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Backend Instance ID: $INSTANCE_ID"

      - name: Wait for SSM Agent
        run: |
          echo "Waiting for SSM agent to be online..."
          for i in {1..30}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.get-instance.outputs.instance_id }}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)

            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is online"
              exit 0
            fi
            if [ "$STATUS" = "None" ] || [ "$STATUS" = "null" ] || [ -z "$STATUS" ]; then
              echo "Waiting... ($i/30) - instance not yet registered with SSM"
            else
              echo "Waiting... ($i/30) - PingStatus=$STATUS"
            fi
            sleep 10
          done
          echo "SSM agent did not come online in time"
          exit 1

      - name: Deploy Container via SSM
        id: deploy-ssm
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="${{ env.REGISTRY }}/${OWNER_LOWER}/ecommerce-backend:${IMAGE_TAG}"
          MONGO_URI_VALUE="${{ secrets.MONGODB_URI }}"
          if [ -z "$MONGO_URI_VALUE" ]; then
            MONGO_URI_VALUE="mongodb://localhost:27017/ecommerce"
            echo "::notice::MONGODB_URI secret not set; using local MongoDB fallback"
          fi
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend container" \
            --parameters commands="[
              'set -e',
              'echo \"Logging into GHCR...\"',
              'echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin',
              'echo \"Pulling image: ${IMAGE_URI}\"',
              'docker pull ${IMAGE_URI}',
              'echo \"Stopping old container...\"',
              'docker stop ecommerce-backend || true',
              'docker rm ecommerce-backend || true',
              'echo \"Starting new container...\"',
              'docker run -d --name ecommerce-backend --restart unless-stopped -p 3000:3000 -e MONGO_URI=${MONGO_URI_VALUE} -e NODE_ENV=production ${IMAGE_URI}',
              'echo \"Deployment complete!\"',
              'docker ps | grep ecommerce-backend'
            ]" \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment command to complete..."
          TERMINAL_REACHED=false
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id ${{ steps.deploy-ssm.outputs.command_id }} \
              --instance-id ${{ steps.get-instance.outputs.instance_id }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Command status ($i/120): $STATUS"

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                TERMINAL_REACHED=true
                break
                ;;
            esac

            sleep 5
          done

          if [ "$TERMINAL_REACHED" != "true" ]; then
            echo "::error::SSM command did not reach terminal state within 10 minutes"
            exit 1
          fi

      - name: Get deployment status
        run: |
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id ${{ steps.deploy-ssm.outputs.command_id }} \
            --instance-id ${{ steps.get-instance.outputs.instance_id }} \
            --query '[Status,ResponseCode,StandardOutputContent,StandardErrorContent]' \
            --output text)
          
          echo "Deployment Status:"
          echo "$OUTPUT"
          
          STATUS=$(echo "$OUTPUT" | awk 'NR==1 {print $1}')
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="['docker ps | grep ecommerce-backend && curl -s http://localhost:3000/health -o /dev/null -w \"%{http_code}\"']" \
            --query 'Command.CommandId' \
            --output text
          
          echo "✅ Backend deployed successfully!"
