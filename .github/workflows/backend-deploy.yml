name: Deploy Backend to EC2

on:
  workflow_run:
    workflows: ["Build and Push Backend Container"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecommerce-backend
  MONGODB_URI: mongodb://localhost:27017/ecommerce

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}  # Set this as a GitHub repository variable
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Backend Instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecommerce-backend" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Backend Instance ID: $INSTANCE_ID"

      - name: Wait for SSM Agent
        run: |
          echo "Waiting for SSM agent to be online..."
          aws ssm wait instance-information-available \
            --instance-id ${{ steps.get-instance.outputs.instance_id }}

      - name: Deploy Container via SSM
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend container" \
            --parameters commands="[
              'set -e',
              'echo \"Logging into ECR...\"',
              'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ECR_REGISTRY}',
              'echo \"Pulling image: ${IMAGE_URI}\"',
              'docker pull ${IMAGE_URI}',
              'echo \"Stopping old container...\"',
              'docker stop ecommerce-backend || true',
              'docker rm ecommerce-backend || true',
              'echo \"Starting new container...\"',
              'docker run -d --name ecommerce-backend --restart unless-stopped -p 3000:3000 -e MONGODB_URI=${{ env.MONGODB_URI }} -e NODE_ENV=production ${IMAGE_URI}',
              'echo \"Deployment complete!\"',
              'docker ps | grep ecommerce-backend'
            ]" \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment command to complete..."
          aws ssm wait command-executed \
            --command-id ${{ env.command_id }} \
            --instance-id ${{ steps.get-instance.outputs.instance_id }} \
            --timeout 300 || true

      - name: Get deployment status
        run: |
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id ${{ env.command_id }} \
            --instance-id ${{ steps.get-instance.outputs.instance_id }} \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text)
          
          echo "Deployment Status:"
          echo "$OUTPUT"
          
          STATUS=$(echo "$OUTPUT" | head -1)
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="['docker ps | grep ecommerce-backend && curl -s http://localhost:3000/health -o /dev/null -w \"%{http_code}\"']" \
            --query 'Command.CommandId' \
            --output text
          
          echo "✅ Backend deployed successfully!"
