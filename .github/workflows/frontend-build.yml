name: Build and Push Frontend Container

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecommerce-frontend
  IMAGE_TAG: ${{ github.sha }}
  DEFAULT_AWS_DEPLOY_ROLE_ARN: arn:aws:iam::457713535842:role/ecommerce-github-actions-ssm-role

permissions:
  id-token: write
  contents: read

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run frontend quality checks
        working-directory: ./Frontend
        run: |
          npm run lint
          npm run build

  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve AWS role ARN
        id: aws-role
        run: |
          ROLE_ARN="${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          if [ -z "$ROLE_ARN" ]; then
            ROLE_ARN="${{ secrets.AWS_DEPLOY_ROLE_ARN }}"
          fi
          if [ -z "$ROLE_ARN" ]; then
            ROLE_ARN="${{ env.DEFAULT_AWS_DEPLOY_ROLE_ARN }}"
          fi

          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Missing AWS_DEPLOY_ROLE_ARN in repository variables/secrets and no fallback is available"
            echo "::error::Run terraform apply in Infra/Aws and set AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi

          if ! echo "$ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+'; then
            echo "::error::Invalid AWS_DEPLOY_ROLE_ARN format: $ROLE_ARN"
            exit 1
          fi

          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify OIDC role assumption
        run: |
          ASSUMED_ARN=$(aws sts get-caller-identity --query 'Arn' --output text)
          echo "::notice::Authenticated to AWS as ${ASSUMED_ARN}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: |
          echo "Image pushed with tags:"
          echo "${{ steps.meta.outputs.tags }}"
          
      - name: Update deployment info
        run: |
          echo "Frontend image built and pushed successfully"
          echo "Repository: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "Tag: ${{ env.IMAGE_TAG }}"
